spring.application.name=demo_chat

# Postgres (Flyway migrations only - JDBC)
spring.datasource.url=jdbc:postgresql://localhost:5432/demo_chat
spring.datasource.username=demo_chat
spring.datasource.password=demo_chat
spring.datasource.hikari.pool-name=demo_chat-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.flyway.schemas=demo_chat

# Postgres (application data access - R2DBC)
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/demo_chat?schema=demo_chat
spring.r2dbc.username=demo_chat
spring.r2dbc.password=demo_chat
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=2
spring.r2dbc.pool.max-size=10

# Cassandra
spring.cassandra.contact-points=localhost
spring.cassandra.port=9042
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.keyspace-name=demo_chat
spring.cassandra.schema-action=create-if-not-exists

# Bedrock
spring.ai.model.embedding=bedrock-titan
spring.ai.bedrock.converse.chat.model=anthropic.claude-3-5-haiku-20241022-v1:0
spring.ai.bedrock.titan.embedding.model=amazon.titan-embed-text-v2:0
spring.ai.bedrock.titan.embedding.input-type=text

# Qdrant
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.use-tls=false
spring.ai.vectorstore.qdrant.collection-name=support_kb
spring.ai.vectorstore.qdrant.initialize-schema=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# RAG pipeline
demo-chat.rag.top-k=3
demo-chat.rag.similarity-threshold=0.75
demo-chat.rag.reindex-on-startup=true

# Guardrail
demo-chat.guardrail.enabled=true

# Semantic cache
demo-chat.cache.enabled=true
demo-chat.cache.similarity-threshold=0.95
demo-chat.cache.qdrant-collection=semantic_cache

# SSE streaming
demo-chat.streaming.chunk-delay-millis=40
