spring.application.name=demo_chat

# Postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/demo_chat
spring.datasource.username=demo_chat
spring.datasource.password=demo_chat
spring.datasource.hikari.pool-name=demo_chat-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.flyway.schemas=demo_chat

# Cassandra
spring.cassandra.contact-points=localhost
spring.cassandra.port=9042
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.keyspace-name=demo_chat

# Bedrock
spring.ai.model.embedding=bedrock-titan

# Qdrant
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.use-tls=false

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
