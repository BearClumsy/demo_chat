// The Flyway Gradle plugin loads its database plugins and JDBC drivers from the buildscript
// classloader, not from the project's configurations — without these two the flyway* tasks fail with
// "No Flyway database plugin found to handle jdbc:postgresql://…". Keep the versions in step with the
// plugin version below and the driver the app resolves at runtime.
buildscript {
	repositories {
		mavenCentral()
	}
	dependencies {
		classpath 'org.flywaydb:flyway-database-postgresql:11.14.1'
		classpath 'org.postgresql:postgresql:42.7.11'
	}
}

plugins {
	id 'java'
	id 'eclipse'
	id 'org.springframework.boot' version '4.0.7'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.8.0'
	// Pinned to the flyway-core version the Spring Boot BOM resolves, so the standalone tasks below
	// run the same engine that migrates on app startup.
	id 'org.flywaydb.flyway' version '11.14.1'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(26)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "2.0.0")
	set('testcontainersVersion', "2.0.5")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-cassandra-reactive'
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webclient'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.ai:spring-ai-markdown-document-reader'
	implementation 'org.springframework.ai:spring-ai-starter-model-bedrock'
	implementation 'org.springframework.ai:spring-ai-starter-model-bedrock-converse'
	implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-cassandra'
	// Only used by the `offline` profile (local Ollama for chat + embeddings, no AWS). Inert
	// otherwise: application.properties pins spring.ai.model.{chat,embedding} to the Bedrock values.
	implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-qdrant'
	implementation 'org.springframework.ai:spring-ai-vector-store-advisor'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.postgresql:r2dbc-postgresql'
	runtimeOnly 'io.r2dbc:r2dbc-pool'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-cassandra-reactive-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-r2dbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webclient-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
		mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
	}
}

// Standalone Flyway tasks (:server:flywayMigrate / :server:flywayInfo) for applying or inspecting the
// Postgres schema without booting the app. The app still migrates on startup via
// spring-boot-starter-flyway; `schemas` MUST match `spring.flyway.schemas` in the profile properties
// or the two paths build separate flyway_schema_history tables and re-run each other's migrations.
// Staging and prod resolve that property from POSTGRES_SCHEMA, so migrating against either means
// passing FLYWAY_SCHEMAS=$POSTGRES_SCHEMA alongside the connection overrides.
// Defaults target the local docker-compose Postgres; override per environment with -Pflyway.* or
// the FLYWAY_* environment variables.
flyway {
	url = findProperty('flyway.url') ?: System.getenv('FLYWAY_URL') ?: 'jdbc:postgresql://localhost:5432/demo_chat'
	user = findProperty('flyway.user') ?: System.getenv('FLYWAY_USER') ?: 'demo_chat'
	password = findProperty('flyway.password') ?: System.getenv('FLYWAY_PASSWORD') ?: 'demo_chat'
	schemas = [findProperty('flyway.schemas') ?: System.getenv('FLYWAY_SCHEMAS') ?: 'demo_chat']
	locations = ["filesystem:${projectDir}/src/main/resources/db/migration"]
	// `flywayClean` drops every object in the schema — keep it unavailable.
	cleanDisabled = true
}

tasks.named('test') {
	useJUnitPlatform()
}

spotless {
	java {
		googleJavaFormat()
		target 'src/*/java/**/*.java'
	}
}

// Read by the Gradle Tooling API when Buildship/jdtls builds its classpath model, so sources and
// javadoc are fetched and attached. Do not run the generated `eclipse`/`eclipseClasspath` tasks —
// they rewrite .classpath with explicit lib entries and drop the Buildship container.
eclipse {
	classpath {
		downloadSources = true
		downloadJavadoc = true
	}
}

tasks.register('downloadDependencySources') {
	description = 'Resolves -sources and -javadoc jars into the Gradle cache.'
	group = 'help'
	doLast {
		def componentIds = configurations.testRuntimeClasspath.incoming.resolutionResult
			.allDependencies.findAll { it instanceof ResolvedDependencyResult }
			.collect { it.selected.id }
		dependencies.createArtifactResolutionQuery()
			.forComponents(componentIds)
			.withArtifacts(JvmLibrary, SourcesArtifact, JavadocArtifact)
			.execute()
			.resolvedComponents
			.each { c ->
				c.getArtifacts(SourcesArtifact).each { logger.lifecycle("src  ${it.file ?: it}") }
				c.getArtifacts(JavadocArtifact).each { logger.lifecycle("doc  ${it.file ?: it}") }
			}
	}
}
