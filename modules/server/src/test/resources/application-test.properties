# Profile used by DemoChatApplicationTests. Hosts and ports come from Testcontainers via
# @DynamicPropertySource; only the settings that must differ from `local` live here.

# Bedrock is not reachable from CI and needs AWS credentials, so both model autoconfigurations are
# switched off and replaced by stub beans in the test's @TestConfiguration.
spring.ai.model.chat=none
spring.ai.model.embedding=none

# The indexer would call the embedding model and write to Qdrant on startup; a wiring test doesn't
# need the knowledge base populated.
demo-chat.rag.reindex-on-startup=false

# Postgres
spring.flyway.schemas=demo_chat
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=1
spring.r2dbc.pool.max-size=5

# Cassandra (the keyspace itself is created by the test before the context starts)
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.keyspace-name=demo_chat
spring.cassandra.schema-action=create-if-not-exists

# Qdrant
spring.ai.vectorstore.qdrant.use-tls=false
spring.ai.vectorstore.qdrant.initialize-schema=true

# No producer or listener runs during the test, so nothing connects to this
spring.kafka.bootstrap-servers=localhost:9092
