# Local, no-AWS profile. Activate it together with `local`, which supplies every host/port:
#   SPRING_PROFILES_ACTIVE=local,offline ./gradlew :server:bootRun    (or: make run-offline)
#
# Chat completions and embeddings come from a local Ollama server (`ollama serve`) instead of
# Amazon Bedrock, so no AWS credentials or region are needed and no AWS SDK beans are created.
# Pull the models first:  make ollama-pull   (llama3.1 + nomic-embed-text)

spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama
spring.ai.ollama.base-url=http://localhost:11434
# Boot only talks to a model that is already pulled; it never downloads one for you.
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.ollama.chat.options.model=llama3.1
spring.ai.ollama.embedding.options.model=nomic-embed-text

# Ollama is local and free, so seed Qdrant on startup (creates the collections, then indexes the
# knowledge base) — otherwise every RAG turn retrieves nothing. nomic-embed-text is 768-dim, so a
# Qdrant volume previously populated under `local` (Titan, 1024-dim) must be reset first:
#   make nuke && make up
spring.ai.vectorstore.qdrant.initialize-schema=true
demo-chat.rag.reindex-on-startup=true

# The groundedness guardrail asks the model for a strict JSON verdict; small local models are
# unreliable at that contract, so skip the stage locally (ResponseValidator returns "grounded").
demo-chat.guardrail.enabled=false
