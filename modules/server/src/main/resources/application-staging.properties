# Staging on AWS. Every value is bound to an environment variable; secrets have NO default, so the
# application fails fast at startup instead of silently falling back to a development credential.
# In AWS these come from Secrets Manager / Parameter Store, injected as ECS task-definition secrets.
#
# This duplicates application-prod.properties rather than importing a shared file: `spring.config.import`
# from a profile-specific document does not take effect, and the two environments are expected to
# diverge (pool sizes, log levels) anyway.

# Postgres (Flyway migrations only - JDBC)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB:demo_chat}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.pool-name=demo_chat-pool
spring.datasource.hikari.maximum-pool-size=${POSTGRES_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${POSTGRES_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.flyway.schemas=${POSTGRES_SCHEMA:demo_chat}

# Postgres (application data access - R2DBC)
spring.r2dbc.url=r2dbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB:demo_chat}?schema=${POSTGRES_SCHEMA:demo_chat}
spring.r2dbc.username=${POSTGRES_USER}
spring.r2dbc.password=${POSTGRES_PASSWORD}
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=${R2DBC_INITIAL_POOL_SIZE:2}
spring.r2dbc.pool.max-size=${R2DBC_MAX_POOL_SIZE:10}

# Cassandra / Amazon Keyspaces
spring.cassandra.contact-points=${CASSANDRA_CONTACT_POINTS}
spring.cassandra.port=${CASSANDRA_PORT:9042}
spring.cassandra.local-datacenter=${CASSANDRA_LOCAL_DATACENTER}
spring.cassandra.keyspace-name=${CASSANDRA_KEYSPACE:demo_chat}
spring.cassandra.username=${CASSANDRA_USER}
spring.cassandra.password=${CASSANDRA_PASSWORD}
# Keyspaces does not support client-side DDL the way a self-managed cluster does; the keyspace and
# tables are provisioned by Terraform, so the app must not try to create them. Override to
# `create-if-not-exists` only for a self-managed Cassandra on EC2.
spring.cassandra.schema-action=${CASSANDRA_SCHEMA_ACTION:none}
spring.cassandra.request.timeout=10s

# Qdrant (self-managed, reached over TLS inside the VPC)
spring.ai.vectorstore.qdrant.host=${QDRANT_HOST}
spring.ai.vectorstore.qdrant.port=${QDRANT_PORT:6334}
spring.ai.vectorstore.qdrant.use-tls=${QDRANT_USE_TLS:true}
spring.ai.vectorstore.qdrant.api-key=${QDRANT_API_KEY}
# Creating a collection asks the embedding model for its dimensions, which is a live Bedrock call.
# Collections are provisioned ahead of the deploy, so leave this off unless bootstrapping.
spring.ai.vectorstore.qdrant.initialize-schema=${QDRANT_INITIALIZE_SCHEMA:false}

# Kafka / MSK
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# More than one task runs per environment, so re-indexing on every start would have N tasks writing
# the same points concurrently. Reindexing is a deploy-pipeline job instead - see
# docs/wiki/Plan/vector-store-schema.md.
demo-chat.rag.reindex-on-startup=false

# Only what the load balancer and CloudWatch need
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Staging is where prompts and intent matching get validated against real Bedrock, so keep the
# pipeline's own logging verbose enough to follow a turn end to end.
logging.level.com.example.demo_chat.rag=DEBUG
