# Production on AWS. Same shape as application-staging.properties (see the note there about why the
# two are duplicated rather than sharing an imported file); the differences are pool sizes and log
# level. Secrets have no defaults, so a missing one fails startup.

# Postgres (Flyway migrations only - JDBC)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB:demo_chat}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.pool-name=demo_chat-pool
spring.datasource.hikari.maximum-pool-size=${POSTGRES_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${POSTGRES_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.flyway.schemas=${POSTGRES_SCHEMA:demo_chat}

# Postgres (application data access - R2DBC)
spring.r2dbc.url=r2dbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB:demo_chat}?schema=${POSTGRES_SCHEMA:demo_chat}
spring.r2dbc.username=${POSTGRES_USER}
spring.r2dbc.password=${POSTGRES_PASSWORD}
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=${R2DBC_INITIAL_POOL_SIZE:5}
spring.r2dbc.pool.max-size=${R2DBC_MAX_POOL_SIZE:30}

# Cassandra / Amazon Keyspaces
spring.cassandra.contact-points=${CASSANDRA_CONTACT_POINTS}
spring.cassandra.port=${CASSANDRA_PORT:9042}
spring.cassandra.local-datacenter=${CASSANDRA_LOCAL_DATACENTER}
spring.cassandra.keyspace-name=${CASSANDRA_KEYSPACE:demo_chat}
spring.cassandra.username=${CASSANDRA_USER}
spring.cassandra.password=${CASSANDRA_PASSWORD}
spring.cassandra.schema-action=${CASSANDRA_SCHEMA_ACTION:none}
spring.cassandra.request.timeout=10s

# Qdrant (self-managed, reached over TLS inside the VPC)
spring.ai.vectorstore.qdrant.host=${QDRANT_HOST}
spring.ai.vectorstore.qdrant.port=${QDRANT_PORT:6334}
spring.ai.vectorstore.qdrant.use-tls=${QDRANT_USE_TLS:true}
spring.ai.vectorstore.qdrant.api-key=${QDRANT_API_KEY}
spring.ai.vectorstore.qdrant.initialize-schema=${QDRANT_INITIALIZE_SCHEMA:false}

# Kafka / MSK
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

demo-chat.rag.reindex-on-startup=false

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

logging.level.com.example.demo_chat=INFO
