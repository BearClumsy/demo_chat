services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: demo_chat
      POSTGRES_USER: demo_chat
      POSTGRES_PASSWORD: demo_chat
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_chat -d demo_chat"]
      interval: 5s
      timeout: 5s
      retries: 10

  cassandra:
    image: cassandra:5
    environment:
      CASSANDRA_CLUSTER_NAME: demo_chat
      # Keep the heap small enough to fit alongside Postgres/Qdrant/Kafka on a memory-constrained
      # local Docker VM; without this Cassandra's auto-sized heap gets OOM-killed (exit 137).
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 10s
      timeout: 10s
      retries: 15

  # Cassandra has no migration tool and spring.cassandra.schema-action only creates tables, not the
  # keyspace itself — so the app fails to start against a fresh volume without this. Idempotent,
  # runs once, exits.
  cassandra-init:
    image: cassandra:5
    depends_on:
      cassandra:
        condition: service_healthy
    restart: "no"
    command: >
      cqlsh cassandra -e
      "CREATE KEYSPACE IF NOT EXISTS demo_chat WITH replication = {'class':'SimpleStrategy','replication_factor':1};"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Local, no-AWS chat + embedding provider for the `offline` Spring profile (`make run-offline`).
  # Gated behind the `offline` Compose profile so plain `make up` (the Bedrock path) never starts it.
  # `make up-offline` starts it AND pulls the models synchronously (the pull can't be a compose
  # sidecar — `up -d` would return before it finishes and `make run-offline` would race the app
  # against a half-downloaded model, failing collection sizing with a 404).
  #
  # On Apple Silicon this runs CPU-only — Docker Desktop / Colima do not pass the Metal GPU through
  # to Linux containers — so it is slower than a native Ollama install, which stays supported. The
  # llama3.1 (8B) model also wants ~6-8 GB RAM on top of Postgres/Cassandra/Qdrant/Kafka, so the
  # Docker VM needs >= ~12 GiB — the default 2 GiB Colima VM OOM-kills llama3.1 on the first chat
  # turn (`ggml_aligned_malloc: insufficient memory`). Fix: `colima stop && colima start --cpu 6
  # --memory 16`. Or switch the offline profile to a smaller model (e.g. llama3.2:3b in
  # application-offline.properties + the `make up-offline` pull commands).
  ollama:
    image: ollama/ollama:latest
    profiles: ["offline"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 15

volumes:
  postgres-data:
  cassandra-data:
  qdrant-data:
  # Holds the pulled Ollama models. Compose-managed, so `make nuke` (`down -v`) wipes it too and the
  # next `make up-offline` re-pulls (~5 GB). `make up-offline` blocks on that pull, so a fresh run is
  # always in a working state even after a nuke.
  ollama-models:
