spring.application.name=demo_chat

# Environment-independent settings only. Everything that differs between a developer machine and a
# deployed environment (hosts, ports, credentials) lives in application-{local,staging,prod}.properties.
# With no SPRING_PROFILES_ACTIVE set, `local` applies, so bootRun and IDE runs behave as before.
spring.profiles.default=local

# Bedrock model selection (the endpoint/region/credentials come from the AWS credential chain).
# Both selectors are set explicitly because the `offline` profile adds a second model starter
# (Ollama) to the classpath; with more than one present, Spring AI needs the choice spelled out.
spring.ai.model.chat=bedrock-converse
spring.ai.model.embedding=bedrock-titan
spring.ai.bedrock.converse.chat.model=anthropic.claude-3-5-haiku-20241022-v1:0
spring.ai.bedrock.titan.embedding.model=amazon.titan-embed-text-v2:0
spring.ai.bedrock.titan.embedding.input-type=text

# Qdrant collection names are part of the application's data contract, not of the deployment
spring.ai.vectorstore.qdrant.collection-name=support_kb
demo-chat.cache.qdrant-collection=semantic_cache

# RAG pipeline
demo-chat.rag.top-k=3
demo-chat.rag.similarity-threshold=0.75

# Guardrail
demo-chat.guardrail.enabled=true

# Semantic cache
demo-chat.cache.enabled=true
demo-chat.cache.similarity-threshold=0.95

# SSE streaming
demo-chat.streaming.chunk-delay-millis=40
